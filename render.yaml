services:
  - type: web
    name: slack-mcp-proxy
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: BASE_URL
        value: https://slack-mcp-proxy.onrender.com
      - key: SESSION_SECRET
        generateValue: true
